<title>Bản mẫu Đám Hiếu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Serif:wght@500;600&display=swap">
<style>
:root{
  --bg:#F7F3EC; --surface:#FFFDF9; --surface-2:#F1EBE1; --border:#E3DBD0; --text:#2B2622; --muted:#6E655C;
  --primary:#7A5A3A; --primary-ink:#FFFDF9; --primary-soft:#EFE4D6; --accent:#B8893E; --accent-soft:#F5EAD3;
  --success:#5E7359; --success-soft:#E6ECE2; --warning:#A8742A; --danger:#9E4638; --danger-soft:#F4E2DE;
  --memorial:#FFFFFF; --memorial-edge:#D8CCBB; --shadow:0 1px 2px rgba(60,40,20,.06),0 8px 24px rgba(60,40,20,.08);
  --proto:#2B2622; --proto-ink:#F3ECE2; --proto-muted:#B3A89B;
  --serif:"Noto Serif",Georgia,"Times New Roman",serif; --sans:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#1C1916; --surface:#26221E; --surface-2:#2E2924; --border:#3A342E; --text:#EFE8DE; --muted:#B3A89B;
  --primary:#C9A57A; --primary-ink:#1C1916; --primary-soft:#3A2F24; --accent:#D4AE67; --accent-soft:#3B311F;
  --success:#8FA887; --success-soft:#27301F; --warning:#D9A45A; --danger:#D98476; --danger-soft:#3A2420;
  --memorial:#2E2924; --memorial-edge:#5A4C3C; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --proto:#0F0D0B; --proto-ink:#EFE8DE; --proto-muted:#8F8578;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#1C1916; --surface:#26221E; --surface-2:#2E2924; --border:#3A342E; --text:#EFE8DE; --muted:#B3A89B;
  --primary:#C9A57A; --primary-ink:#1C1916; --primary-soft:#3A2F24; --accent:#D4AE67; --accent-soft:#3B311F;
  --success:#8FA887; --success-soft:#27301F; --warning:#D9A45A; --danger:#D98476; --danger-soft:#3A2420;
  --memorial:#2E2924; --memorial-edge:#5A4C3C; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --proto:#0F0D0B; --proto-ink:#EFE8DE; --proto-muted:#8F8578;}

html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.005em}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- Prototype toolbar ---------- */
.proto{background:var(--proto);color:var(--proto-ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 16px;font-size:13px;flex:0 0 auto}
.proto .brand{font-family:var(--serif);font-weight:600;font-size:14px;white-space:nowrap}
.proto .brand small{font-family:var(--sans);font-weight:400;color:var(--proto-muted);margin-left:6px}
.proto select{background:transparent;border:1px solid #5a5048;border-radius:8px;padding:5px 8px;max-width:280px;color:var(--proto-ink)}
.proto select option{color:#2B2622}
.seg{display:inline-flex;border:1px solid #5a5048;border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;padding:5px 10px;color:var(--proto-muted)}
.seg button[aria-pressed="true"]{background:var(--proto-ink);color:var(--proto)}
.pbtn{background:transparent;border:1px solid #5a5048;border-radius:8px;padding:5px 10px;color:var(--proto-ink)}
.pbtn[aria-pressed="true"]{background:#D4AE67;color:#1C1916;border-color:#D4AE67}
.codes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:#3a332d;color:#F3ECE2;padding:3px 8px;border-radius:6px;white-space:nowrap}
.code b{color:#D4AE67;font-weight:600;margin-right:4px}
@media (max-width:760px){.proto .brand small,.proto .hide-sm{display:none}.codes{margin-left:0;width:100%}.proto select{max-width:100%;flex:1}}

/* ---------- Stage ---------- */
.stage{flex:1 1 auto;min-height:0;display:flex;justify-content:center;align-items:stretch;padding-block:0}
.stage.phone-frame{padding:18px 16px;align-items:center;background:var(--surface-2)}
.app{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex}
.stage.desk-frame{justify-content:flex-start;align-items:flex-start;overflow:hidden;background:var(--surface-2)}
.desk-frame .app{flex:0 0 auto}
.phone-frame .app{width:390px;max-width:100%;height:min(844px,100%);border-radius:34px;border:10px solid #1f1a16;box-shadow:var(--shadow)}

/* ---------- Desktop shell ---------- */
.shell-d{display:grid;grid-template-columns:248px minmax(0,1fr);grid-template-rows:minmax(0,1fr);width:100%;height:100%;min-height:0}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;gap:4px;overflow-y:auto}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--serif);font-weight:600;font-size:18px;color:var(--primary)}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%;color:var(--text);position:relative}
.nav-item:hover{background:var(--surface-2)}
.nav-item[aria-current="page"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.nav-item .count{margin-left:auto;background:var(--danger);color:#fff;border-radius:999px;font-size:12px;padding:0 7px;font-weight:600}
.nav-item.later{color:var(--muted)}
.nav-item .tag{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:0 6px}
.side .sep{height:1px;background:var(--border);margin:10px 8px}
.main-d{display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
.head-d{display:flex;align-items:center;gap:16px;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface)}
.head-d .case{min-width:0}
.head-d .case h2{font-size:17px}
.head-d .case p{color:var(--muted);font-size:13px}
.head-d .tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;position:relative;color:var(--text)}
.icon-btn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:999px;background:var(--danger);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:999px;padding:6px 12px 6px 6px;background:var(--surface);font-size:13px}
.switch .knob{width:30px;height:18px;border-radius:999px;background:var(--border);position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-pressed="true"] .knob{background:var(--primary)}
.switch[aria-pressed="true"] .knob::after{transform:translateX(12px)}
.content{flex:1;overflow-y:auto;min-height:0}
.page{padding:24px 28px 40px;max-width:1180px;display:flex;flex-direction:column;gap:20px}
.page-title{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-title h1{font-size:26px}
.page-title p{color:var(--muted)}
.page-title .actions{margin-left:auto;display:flex;gap:8px}

/* ---------- Mobile shell ---------- */
.shell-m{display:flex;flex-direction:column;width:100%;height:100%;min-height:0}
.top-m{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 8px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--border);min-height:58px}
.top-m .t{flex:1;min-width:0;padding-left:8px}
.top-m .t h2{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-m .t p{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-m .icon-btn{border:0;background:transparent;width:44px;height:44px}
.shell-m .content{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.shell-m .page{padding:16px 16px 24px;gap:16px}
.shell-m .page-title h1{font-size:22px}
.bottom-nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.bn{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);min-height:60px;position:relative}
.bn[aria-current="page"]{color:var(--primary);font-weight:600}
.bn[aria-current="page"] svg{stroke:var(--primary)}
.bn .count{position:absolute;top:5px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;font-weight:600}

/* ---------- Bare (no shell) ---------- */
.bare{width:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column}
.bare-inner{width:100%;max-width:560px;margin:0 auto;padding:28px 16px 40px;display:flex;flex-direction:column;gap:18px;flex:1}
.bare-foot{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;max-width:560px;margin:0 auto;width:100%}

/* ---------- Components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px}
.card-pad{padding:16px}
.sec-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sec-h h3{font-size:16px}
.sec-h .muted{margin-left:auto}
.muted{color:var(--muted);font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.btn{border-radius:10px;padding:10px 16px;min-height:44px;border:1px solid var(--border);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.todo{border-color:var(--primary);color:var(--primary)}
.pill.doing{background:var(--accent-soft);color:var(--warning)}
.pill.wait{background:var(--primary-soft);color:var(--primary)}
.pill.issue{background:var(--danger-soft);color:var(--danger)}
.pill.done{background:var(--success-soft);color:var(--success)}
.pill.skip{background:var(--surface-2);color:var(--muted)}
.pill.lock{background:var(--danger-soft);color:var(--danger)}
.pill.prio{background:var(--accent-soft);color:var(--warning)}
.pill.soft{background:var(--surface-2);color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--border);background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.list > .row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:500}
.row .meta{font-size:13px;color:var(--muted);display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:3px}
.row .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chev{color:var(--muted);flex:0 0 auto;margin-top:2px}
.memorial{display:flex;gap:16px;align-items:center;background:var(--memorial);border:1px solid var(--memorial-edge);border-radius:14px;padding:16px}
.portrait{width:64px;height:80px;border-radius:8px;border:1.5px solid var(--accent);display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:0 0 auto}
.memorial h2{font-size:19px}
.memorial .sub{color:var(--muted);font-size:13px}
.grid-2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
.phase-bar{display:flex;gap:3px;margin-top:8px}
.phase-bar i{flex:1;height:6px;border-radius:3px;background:var(--border)}
.phase-bar i.done{background:var(--success)}
.phase-bar i.cur{background:var(--accent)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:14px}
.banner.upd{background:var(--accent-soft);color:var(--text)}
.banner.upd svg{stroke:var(--warning)}
.banner.warn{background:var(--danger-soft)}
.banner.warn svg{stroke:var(--danger)}
.banner.info{background:var(--surface-2)}
.note{font-size:12px;color:var(--muted);font-style:italic;border-left:2px dashed var(--border);padding-left:10px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
details.fold{border-top:1px solid var(--border)}
details.fold > summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500}
details.fold > summary::-webkit-details-marker{display:none}
details.fold[open] > summary .chev{transform:rotate(90deg)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--memorial-edge)}
.opt[aria-checked="true"]{border-color:var(--primary);background:var(--primary-soft)}
.opt .radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);flex:0 0 auto;margin-top:2px;display:grid;place-items:center}
.opt[aria-checked="true"] .radio{border-color:var(--primary)}
.opt[aria-checked="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--primary)}
.opt .title{font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 14px;min-height:38px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea.input{min-height:80px;resize:vertical}
.impact{display:flex;flex-direction:column;gap:0}
.impact .grp{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.impact .grp:first-child{border-top:0}
.impact .lbl{width:110px;flex:0 0 auto;font-size:13px;color:var(--muted);font-weight:500}
.impact ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--muted);font-size:12.5px;padding:10px 16px;border-bottom:1px solid var(--border)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.who{display:flex;align-items:center;gap:10px}
.who .av{width:34px;height:34px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--primary);flex:0 0 auto}
.rank{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--primary);flex:0 0 auto}
.vend-top{border:1.5px solid var(--primary);background:var(--primary-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.dist{font-weight:600;color:var(--primary);white-space:nowrap}
.map-svg{width:100%;height:auto;display:block;max-width:100%}
.map-svg .ring{fill:none;stroke:var(--border);stroke-dasharray:4 4}
.map-svg .venue{fill:var(--primary)}
.map-svg .v-ok{fill:var(--accent)}
.map-svg .v-top{fill:var(--primary);stroke:var(--surface);stroke-width:2}
.map-svg .v-out{fill:var(--border)}
.map-svg text{fill:var(--text);font-family:var(--sans);font-size:10px}
.map-svg .ltxt{fill:var(--muted);font-size:9px}
.stepper{display:flex;gap:4px}
.stepper i{flex:1;height:4px;border-radius:2px;background:var(--border)}
.stepper i.on{background:var(--primary)}
.big-q{font-size:24px;line-height:1.3}
.entry-card{display:flex;flex-direction:column;gap:6px;text-align:left;padding:20px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);width:100%}
.entry-card:hover{border-color:var(--primary)}
.entry-card h3{font-size:19px}
.entry-card.main{border-color:var(--primary)}
.num-badge{width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:13px;flex:0 0 auto}
.rail{overflow-x:auto;padding-bottom:4px}
.rail-inner{display:grid;grid-template-columns:repeat(15,minmax(96px,1fr));gap:6px;min-width:1100px}
.rail-step{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:92px}
.rail-step .n{font-size:12px;color:var(--muted)}
.rail-step .nm{font-size:12.5px;line-height:1.35;font-weight:500}
.rail-step.done{background:var(--success-soft);border-color:transparent}
.rail-step.cur{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rail-step[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.rail-step[aria-pressed="true"] .n,.rail-step[aria-pressed="true"] .muted{color:var(--primary-ink);opacity:.85}
.rail-step .here{align-self:flex-start;font-size:11px;font-weight:600;color:var(--warning);background:var(--accent-soft);border-radius:999px;padding:0 7px}
.rail-step[aria-pressed="true"] .here{color:var(--primary);background:var(--primary-ink)}
details.fold > summary.cur-sel{background:var(--primary-soft)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;font-size:14.5px}
.check input{width:20px;height:20px;accent-color:var(--primary);margin-top:2px;flex:0 0 auto}
.link-box{display:flex;gap:8px;align-items:center;border:1px dashed var(--memorial-edge);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-family:ui-monospace,Consolas,monospace;font-size:13.5px}
.link-box span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mode-m .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.mode-m .tile .v{font-size:18px}
.tile.warn .v{color:var(--danger)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.ok i{background:var(--success)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
.tab[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.segin{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.segin button{border:0;background:var(--surface);padding:8px 12px;font-size:13.5px;color:var(--muted);min-height:40px}
.segin button[aria-pressed="true"]{background:var(--primary-soft);color:var(--primary);font-weight:600}
.proto-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--memorial-edge);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bottom-nav.four{grid-template-columns:repeat(4,1fr)}
.obit{max-width:640px;margin:0 auto;padding:28px 16px 48px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;width:100%}
.obit .name{font-family:var(--serif);font-size:30px;letter-spacing:.05em;text-transform:uppercase;line-height:1.25}
.obit .portrait{width:120px;height:150px;border-radius:10px}
.obit .sched{width:100%;text-align:left}
.cond{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-top:1px solid var(--border)}
.cond:first-child{border-top:0}
.cond .mark{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:var(--surface-2);color:var(--muted)}
.cond.ok .mark{background:var(--success-soft);color:var(--success)}
input[type=range]{accent-color:var(--primary);width:100%}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.mode-m .split{grid-template-columns:1fr}
.map-svg .pin{fill:var(--danger);stroke:var(--surface);stroke-width:2}
.map-svg .pin-r{fill:var(--danger);fill-opacity:.08;stroke:var(--danger);stroke-dasharray:4 3}
.map-svg .venue-sq{fill:var(--primary)}
#admMap{cursor:crosshair}
.proto-panel{border:1px dashed var(--memorial-edge);border-radius:10px;padding:8px 12px}
.proto-panel>summary{list-style:none;display:flex;gap:10px;align-items:center;flex-wrap:wrap;cursor:pointer;font-size:13px}
.proto-panel>summary::-webkit-details-marker{display:none}
.pp-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pp-row>b{min-width:130px;font-weight:500}
.subs{list-style:none;margin:10px 0 2px;padding:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.subs li{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-top:1px solid var(--border);font-size:14px;min-height:48px}
.subs li:first-child{border-top:0}
.subs .grow{flex:1;min-width:0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 16px;color:var(--muted)}
.empty svg{stroke:var(--accent)}

/* ---------- Sheet / drawer ---------- */
.layer{position:absolute;inset:0;z-index:20;display:flex}
.scrim{position:absolute;inset:0;background:rgba(28,20,12,.38)}
.sheet{position:relative;background:var(--surface);display:flex;flex-direction:column;max-height:88%;width:100%;margin-top:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow);animation:up .2s ease-out}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border);margin:8px auto 0}
.sheet-h{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.sheet-h h3{font-size:18px;flex:1}
.sheet-b{padding:4px 16px 16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);display:flex;gap:10px}
.sheet-f .btn{flex:1}
.mode-d .layer{justify-content:flex-end}
.mode-d .sheet{margin-top:0;max-height:none;height:100%;width:440px;max-width:100%;border-radius:0;animation:left .2s ease-out}
.mode-d .sheet .grab{display:none}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes left{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.mode-d .toast{bottom:24px}
@media (prefers-reduced-motion:reduce){.sheet,.mode-d .sheet{animation:none}.switch .knob,.switch .knob::after{transition:none}}

/* mobile-only tweaks */
.mode-m .grid-2{grid-template-columns:1fr}
.mode-m .kv{grid-template-columns:110px 1fr}
.mode-m .page-title .actions{margin-left:0;width:100%}
.mode-m .impact .grp{flex-direction:column;gap:6px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
svg.i.sm{width:16px;height:16px}
svg.i.lg{width:28px;height:28px}

function rank(cat,venKey){
 const ven=VENUES[venKey||S.venue];
 const all=S.dir.filter(v=>!v.family&&hasCat(v,cat)&&v.active&&(v.cond==='both'||v.cond===S.form)).map(v=>({v,d:distTo(v,ven),prio:S.familyPick[cat]===v.id}));
 all.forEach(o=>o.ok=o.d<=o.v.r);
 const ok=all.filter(o=>o.ok).sort((a,b)=>(b.prio-a.prio)||(a.d-b.d));
 const out=all.filter(o=>!o.ok&&o.prio);
 return{ok,out};
}
function catState(cat){
 const cv=S.caseV[cat]; const r=rank(cat);
 if(cv.status==='committed'||cv.status==='confirmed'){const v=dirV(cv.vid);return{status:cv.status,v,d:distTo(v,V()),r};}
 return{status:r.ok.length?'suggest':'empty',v:r.ok[0]&&r.ok[0].v,d:r.ok[0]&&r.ok[0].d,r};
}

function applyVenueChange(to){
 const before={};CATS.forEach(c=>{const cs=catState(c.k);before[c.k]=cs.v&&cs.v.id;});
 S.venue=to; dec('d1').chosen=to;
 if(to==='home')S.decisions=S.decisions.filter(d=>!(d.id==='d4'&&d.status==='pending'));
 S.updatedCats={};
 CATS.forEach(c=>{const cs=catState(c.k);if(cs.status==='suggest'||cs.status==='empty'){if((cs.v&&cs.v.id)!==before[c.k])S.updatedCats[c.k]=true;}});
 S.updatedAt='14:05';
 const xe=S.caseV.xe;
 if(to!=='home'&&xe.status==='committed'&&!dec('d4')){
  const v=dirV(xe.vid),d=distTo(v,V()),alt=rank('xe').ok.filter(o=>o.v.id!==xe.vid);
  S.decisions.push({id:'d4',kind:'vendor',cat:'xe',title:v.name+' cách nơi tổ chức mới '+km(d),status:'pending',
   from:'Tự động khi đổi nơi tổ chức',oldD:distTo(v,VENUES.home),
   options:[{k:'keep',label:'Giữ '+v.name,note:'Đã cam kết · cách '+km(d)+' (trước đây '+km(distTo(v,VENUES.home))+')'}].concat(alt.slice(0,2).map(o=>({k:o.v.id,label:'Đổi sang '+o.v.name,note:'Cách nơi tổ chức mới '+km(o.d)+(o===alt[0]?' · gần nhất':'')})))});
 }
}
function impactOfVenue(to){
 const lines={viec:[],nguoi:[],chiphi:[],ncc:[],khach:[]};
 if(to==='hall'){lines.viec.push('Thêm việc: Đặt phòng lễ tại Nhà tang lễ Thanh Bình','Việc “Thuê rạp, bàn ghế” có thể thu hẹp hoặc bỏ — người phụ trách xem lại');}
 else lines.viec.push('Thêm lại việc dựng rạp tại nhà');
 lines.nguoi.push('Anh Hùng (Nhà cung cấp) và chị Lan (Hậu cần) nhận thông báo thay đổi');
 lines.chiphi.push('Có thể phát sinh phí phòng lễ — chưa có báo giá');
 let changed=0,committed=[];
 CATSV().forEach(c=>{const cv=S.caseV[c.k];if(cv.status==='committed')committed.push(dirV(cv.vid));else{const a=rank(c.k,S.venue).ok[0],b=rank(c.k,to).ok[0];if((a&&a.v.id)!==(b&&b.v.id))changed++;}});
 lines.ncc.push(changed+' hạng mục chưa cam kết sẽ được gợi ý lại theo địa chỉ mới');
 committed.forEach(v=>lines.ncc.push(v.name+' đã cam kết — app không tự thay; sẽ tạo mục Cần quyết (cách địa chỉ mới '+km(distTo(v,VENUES[to]))+')'));
 lines.khach.push('Trang thông tin cho khách sẽ cập nhật địa điểm và gắn nhãn “Thông tin đã thay đổi”');
 return lines;
}

function isMobile(){
 if(S.mode==='phone')return true;
 if(S.mode==='desk')return false;
 return window.innerWidth<900;
}
function assetId(){
 const base=S.screen, core='A-'+base.slice(2);
 const sid=S.sheet&&SHEET_IDS[S.sheet.id];
 if(sid) return {screen:sid,asset:'A-'+sid.slice(2)+(isMobile()?(S.dark&&sid==='S-GST-05'?'-MN':'-M'):'-D')};
 if(scr(base).wf) return {screen:base,asset:'WF · theo đặc tả'};
 let suf;
 if(S.screen==='S-VEN-02'&&S.updatedCats[S.cat]) suf='-UPD';
 else if(S.screen==='S-VEN-02'&&catState(S.cat).status==='empty') suf='-EMPTY';
 else if(S.screen==='S-DEC-02'&&dec(S.decId)&&dec(S.decId).kind==='vendor') suf='-VEN';
 else if(S.screen==='S-TEAM-06'&&S.linkExpired) suf='-EXP';
 else if((S.screen==='S-FIN-06'||S.screen==='S-PRE-09')&&S.role==='viewer') suf='-Q';
 else suf=isMobile()?(S.dark&&base==='S-MAP-01'?'-MN':'-M'):'-D';
 return {screen:base,asset:core+suf};
}

  if(id==='S-MAP-07'){S.tform={mode:'new',id:null,title:'',phase:S.phaseSel||curPhase,due:'',owner:'',area:'Toàn bộ',note:'',err:null};S.sheet={id:'taskform'};}

 } else {S.screen=id;S.sheet=null;}
 Object.assign(S,opts||{});
 try{history.replaceState(null,'','#'+id)}catch(e){}
 render();
 const c=document.querySelector('.content,.bare');if(c)c.scrollTop=0;

 if(isMobile())return `<div class="page">${head}${T.map(([k,l])=>`<section class="card"><div class="sec-h card-pad" style="margin:0;padding-bottom:0"><h3>${l}</h3></div>${secs[k]}</section>`).join('')}</div>`;

 const tiles=[['Dự kiến',T.plan,'Tổng dự toán các khoản'],['Đã chi',T.paid,'Đã trả, kể cả tiền cọc'],['Còn trả',T.owe,S.fin.debtMoved?'Đã chuyển sang theo dõi hậu tang':'Khoản đã duyệt chưa trả hết'],['Phát sinh',T.extra,'Ngoài dự toán ban đầu']];

  <div class="tiles">${tiles.map(([l,v,s])=>`<div class="tile"><span class="muted">${l}</span><span class="v">${money(v)}</span><span class="muted" style="font-size:12px">${s}</span></div>`).join('')}</div>

/* Dời mọi mốc ngày theo ngày mất (dữ liệu mẫu gốc lấy 24/09/2026) */
const SAMPLE_DEATH='2026-09-24';
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/86400000);
const offsetNow=()=>S.person.death?dayDiff(SAMPLE_DEATH,S.person.death):0;
function shiftStr(s,days){if(typeof s!=='string'||!days)return s;
 const fmt=(d,withYear)=>p2(d.getDate())+'/'+p2(d.getMonth()+1)+(withYear?'/'+d.getFullYear():'');
 return s.replace(/(\d{1,2})(\s*(?:–|-|và)\s*)(\d{1,2})\/(\d{2})(?:\/(\d{4}))?|(\d{1,2})\/(\d{2})(?:\/(\d{4}))?/g,(m,a,sep,b,mo,y,c,mo2,y2)=>{
  if(a!==undefined){const Y=+(y||2026),d1=addD(new Date(Y,+mo-1,+a),days),d2=addD(new Date(Y,+mo-1,+b),days);return (d1.getMonth()===d2.getMonth()?String(d1.getDate()):fmt(d1,false))+sep+fmt(d2,!!y);}
  const d=addD(new Date(+(y2||2026),+mo2-1,+c),days);return fmt(d,!!y2);});}
function shiftAll(days){if(!days)return;S.tasks.forEach(x=>{x.due=shiftStr(x.due,days);});S.decisions.forEach(d=>{d.due=shiftStr(d.due,days);(d.options||[]).forEach(o=>{o.label=shiftStr(o.label,days);o.note=shiftStr(o.note,days);});});}

// toolbar
const sel=document.getElementById('screenSel');
let lastG='';sel.innerHTML=SCREENS.reduce((h,s)=>{let o='';if(s.grp!==lastG){o+=(lastG?'</optgroup>':'')+`<optgroup label="${s.grp}">`;lastG=s.grp;}return h+o+`<option value="${s.id}">${s.id.replace('@',' · ')} — ${s.name}</option>`;},'')+'</optgroup>';
sel.addEventListener('change',()=>go(sel.value));
document.getElementById('mAuto').onclick=()=>{S.mode='auto';saveUI();render();};
document.getElementById('mDesk').onclick=()=>{S.mode='desk';saveUI();render();};
document.getElementById('mPhone').onclick=()=>{S.mode='phone';saveUI();render();};
document.getElementById('darkBtn').onclick=()=>{S.dark=!S.dark;saveUI();render();};
document.getElementById('resetBtn').onclick=()=>{const m=S.mode,d=S.dark;S=fresh();S.mode=m;S.dark=d;curPhase=4;saveUI();go('S-ENT-01');toast('Đã đặt lại dữ liệu và lựa chọn về mặc định');};
document.getElementById('blankBtn').onclick=()=>{blankCase();go('S-ENT-01');toast('Đã tạo gia đình trống — trả lời câu hỏi hoàn cảnh để bắt đầu');};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});
window.addEventListener('resize',()=>{clearTimeout(window._rz);window._rz=setTimeout(render,120);});

/* Mở lại lựa chọn nhánh đã lưu (hỏa táng/địa táng, nghi lễ, hình thức tổ chức) */
try{const b=savedBranch;if(b){
 if(b.form&&FORM[b.form]&&b.form!==S.form)applyForm(b.form);
 if(b.place&&PLACE[b.place])applyPlace(b.place);if(b.scale&&SCALE[b.scale])applyScale(b.scale);
 if(b.ritePrev&&RITE[b.ritePrev])S.ritePrev=b.ritePrev;
 if(b.org&&MODEL[b.org]&&b.org!=='family'){if(b.org!=='official'&&b.rite&&RITE[b.rite]&&b.rite!=='none')applyRite(b.rite);applyOrg(b.org,ORGT[b.otype]?b.otype:'cadre');}
 else if(b.rite&&RITE[b.rite]&&b.rite!=='none'&&b.rite!==S.rite)applyRite(b.rite);
}}catch(e){}
const h=(location.hash||'').slice(1);
if(h&&scr(h.replace('@','@'))){go(h);}else render();
})();
</script>
